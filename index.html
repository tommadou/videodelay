<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#000"><title>Video Delay</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:manipulation}#cam{position:fixed;width:1px;height:1px;opacity:.001;pointer-events:none}#out{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000}.top{position:fixed;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:18px;background:rgba(0,0,0,.48);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:3}.top button{border:0;color:#fff;background:transparent;font-size:24px;width:42px;height:42px;border-radius:50%}.delay{min-width:64px;text-align:center;font-size:17px;font-weight:650;font-variant-numeric:tabular-nums}.start{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:3;border:0;border-radius:22px;padding:11px 22px;font-weight:700;font-size:16px;background:#fff;color:#000}.settings{position:fixed;right:12px;bottom:max(18px,env(safe-area-inset-bottom));z-index:4}.gear{border:0;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}.panel{position:absolute;right:0;bottom:48px;display:none;min-width:150px;padding:8px;border-radius:16px;background:rgba(20,20,20,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}.panel.open{display:block}.qbtn{width:100%;border:0;border-radius:11px;padding:10px 12px;margin:2px 0;background:transparent;color:#fff;text-align:left;font:inherit}.qbtn.active{background:rgba(255,255,255,.16);font-weight:700}.diag{margin:7px 4px 3px;padding-top:7px;border-top:1px solid rgba(255,255,255,.12);font-size:11px;color:#bbb;line-height:1.45}.modebtn{width:100%;border:0;border-radius:11px;padding:9px 12px;margin:2px 0;background:transparent;color:#fff;text-align:left;font:inherit}.modebtn.active{background:rgba(255,255,255,.16);font-weight:700}.badge{position:fixed;left:12px;bottom:max(18px,env(safe-area-inset-bottom));z-index:3;font-size:12px;padding:6px 9px;border-radius:12px;background:rgba(0,0,0,.45);color:#ddd}.msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:28px;text-align:center;background:#080808;z-index:10}.msg>div{max-width:520px;line-height:1.45}.msg b{display:block;font-size:20px;margin-bottom:8px}.buffering{position:fixed;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;z-index:2}.buffering.show{display:flex}.buffering>div{padding:14px 18px;border-radius:18px;background:rgba(0,0,0,.48);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);text-align:center}.buffering b{display:block;font-size:18px}.buffering span{display:block;margin-top:3px;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
</style></head><body><video id="cam" autoplay muted playsinline></video><canvas id="out"></canvas><div class="top"><button id="minus">−</button><div class="delay"><span id="d">10</span> s</div><button id="plus">+</button></div><button id="start" class="start">Start</button><div id="badge" class="badge">720p · 30 fps · 60 s · v12.1</div><div class="settings"><button id="gear" class="gear" aria-label="Video settings">⚙︎</button><div id="panel" class="panel"><button class="qbtn active" data-profile="720-30">720p · 30 fps</button><button class="qbtn" data-profile="1080-30">1080p · 30 fps</button><button class="qbtn" data-profile="720-60">720p · 60 fps</button><button class="qbtn" data-profile="1080-60">1080p · 60 fps</button><div class="diag" id="diag">Camera input: —</div><button class="modebtn active" data-mode="delay">Delayed</button><button class="modebtn" data-mode="live">Live camera</button></div></div><div id="buffering" class="buffering"><div><b>Buffering</b><span id="bufferCount">10 s</span></div></div><div id="msg" class="msg"><div><b>Browser not supported</b><span id="msgtext"></span></div></div><script>
(()=>{
const MAX=60;let FPS=30,KEY_EVERY=30,quality=720,W=1280,H=720,BITRATE=8_000_000,profile="720-30";
const cam=document.querySelector('#cam'),canvas=document.querySelector('#out'),ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});
const dEl=document.querySelector('#d'),startBtn=document.querySelector('#start'),msg=document.querySelector('#msg'),msgtext=document.querySelector('#msgtext'),badge=document.querySelector('#badge'),gear=document.querySelector('#gear'),panel=document.querySelector('#panel'),buffering=document.querySelector('#buffering'),bufferCount=document.querySelector('#bufferCount');
canvas.width=W;canvas.height=H;let delay=10,running=false,stream=null,encoder=null,decoder=null,chunks=[],configs=[],startPerf=0,lastCapture=0,lastShown=-1,decodeTarget=-1,decodeBusy=false,raf=0,viewMode="delay",rotateView=false;
function drawUpright(source){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle="#000";ctx.fillRect(0,0,canvas.width,canvas.height);if(rotateView){ctx.translate(canvas.width,0);ctx.rotate(Math.PI/2);ctx.drawImage(source,0,0,canvas.height,canvas.width)}else{ctx.drawImage(source,0,0,canvas.width,canvas.height)}ctx.restore()}
function fail(t){msgtext.textContent=t;msg.style.display='flex'}
function supported(){return !!(navigator.mediaDevices?.getUserMedia&&window.VideoEncoder&&window.VideoDecoder&&window.VideoFrame)}
async function codec(){const avcCodec=H>720?'avc1.420028':'avc1.42001f';for(const c of [{codec:avcCodec,avc:{format:'annexb'}},{codec:'vp8'}]){try{let r=await VideoEncoder.isConfigSupported({codec:c.codec,width:W,height:H,bitrate:BITRATE,framerate:FPS,...(c.avc?{avc:c.avc}:{})});if(r.supported)return c}catch(e){}}return null}
function trim(nowUs){
  /* Keep a decodable rolling window. We only cut at a keyframe boundary. */
  const cut=nowUs-(MAX+2)*1e6;
  if(chunks.length<2||chunks[0].timestamp>=cut)return;

  /* Find the first keyframe at/after the cutoff. Everything before it can go. */
  let removeCount=0;
  for(let i=0;i<chunks.length;i++){
    if(chunks[i].timestamp>=cut&&chunks[i].type==='key'){removeCount=i;break}
  }
  if(removeCount<=0)return;

  /* playIndex is an index into chunks, so it MUST move with the array. */
  if(playIndex>=0){
    if(playIndex<removeCount){
      playIndex=-1;
      needSeek=true;
    }else{
      playIndex-=removeCount;
    }
  }
  chunks.splice(0,removeCount);

  /* Decoder configs are tiny. Keep the newest config from before the retained
     window plus all later configs, so any future seek can still configure. */
  if(configs.length>1&&chunks.length){
    const firstTs=chunks[0].timestamp;
    let anchor=0;
    for(let i=0;i<configs.length;i++){
      if(configs[i].timestamp<=firstTs)anchor=i; else break;
    }
    if(anchor>0)configs.splice(0,anchor);
  }
}
async function init(){if(!supported())return fail('This version needs WebCodecs. Update Safari/Chrome and open the app over HTTPS.');const cc=await codec();if(!cc)return fail('No compatible hardware video codec was found on this browser.');
stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:W},height:{ideal:H},frameRate:{ideal:FPS,max:FPS}}});cam.srcObject=stream;await cam.play();const tr=stream.getVideoTracks()[0];const st=tr?.getSettings?.()||{};rotateView=!!(st.width&&st.height&&st.height>st.width&&W>H);canvas.width=rotateView?H:W;canvas.height=rotateView?W:H;const diag=document.querySelector("#diag");if(diag)diag.textContent=`Camera input: ${st.width||"?"} × ${st.height||"?"} · ${st.frameRate?Math.round(st.frameRate)+" fps":"fps ?"}${rotateView?" · portrait":""}`;
const ec={codec:cc.codec,width:W,height:H,bitrate:BITRATE,framerate:FPS,latencyMode:'realtime',bitrateMode:'variable',hardwareAcceleration:'prefer-hardware',...(cc.avc?{avc:cc.avc}:{})};
encoder=new VideoEncoder({output:(chunk,meta)=>{const copy=new Uint8Array(chunk.byteLength);chunk.copyTo(copy);chunks.push({type:chunk.type,timestamp:chunk.timestamp,duration:chunk.duration||Math.round(1e6/FPS),data:copy});if(meta?.decoderConfig)configs.push({timestamp:chunk.timestamp,config:meta.decoderConfig});trim(chunk.timestamp)},error:e=>fail('Video encoder error: '+e.message)});encoder.configure(ec);
decoder=new VideoDecoder({output:frame=>{if(frame.timestamp>=decodeTarget){drawUpright(frame);lastShown=frame.timestamp}frame.close()},error:e=>{console.error(e)}});
startPerf=performance.now();lastCapture=0;captureCount=0;droppedCapture=0;running=true;startBtn.textContent='Stop';updateBuffering(performance.now());loop();}
let captureCount=0,droppedCapture=0;
function capture(now){if(!running||cam.readyState<2||!encoder||encoder.state!=='configured')return;const elapsed=now-startPerf;const step=1000/FPS;if(elapsed-lastCapture<step*.92)return;lastCapture+=step;if(lastCapture<elapsed-step*2)lastCapture=elapsed;/* Never let encoder backlog stall the UI. */if(encoder.encodeQueueSize>3){droppedCapture++;return}const ts=Math.round(lastCapture*1000);try{const f=new VideoFrame(cam,{timestamp:ts});encoder.encode(f,{keyFrame:(captureCount%KEY_EVERY)===0});captureCount++;f.close()}catch(e){console.error(e)}}
let playIndex=-1,playBasePerf=0,playBaseTs=0,currentDelay=delay,needSeek=true;
function findKeyframe(target){for(let i=chunks.length-1;i>=0;i--){if(chunks[i].timestamp<=target&&chunks[i].type==='key')return i}return -1}
async function seekPlayback(now,target){if(decodeBusy)return;const idx=findKeyframe(target);if(idx<0)return;decodeBusy=true;try{if(decoder.state!=='unconfigured')decoder.reset();let cfg=null;for(let i=configs.length-1;i>=0;i--){if(configs[i].timestamp<=chunks[idx].timestamp){cfg=configs[i].config;break}}if(!cfg){const cc=await codec();cfg={codec:cc.codec,codedWidth:W,codedHeight:H}}cfg={...cfg,hardwareAcceleration:'prefer-hardware',optimizeForLatency:true};decoder.configure(cfg);decodeTarget=target;for(let i=idx;i<chunks.length&&chunks[i].timestamp<=target;i++){const c=chunks[i];decoder.decode(new EncodedVideoChunk({type:c.type,timestamp:c.timestamp,duration:c.duration,data:c.data}));playIndex=i+1}await decoder.flush();playBasePerf=now;playBaseTs=target;currentDelay=delay;needSeek=false}catch(e){console.error('seek',e)}finally{decodeBusy=false}}
async function render(now){if(viewMode==="live"){if(cam.readyState>=2)drawUpright(cam);return}if(!chunks.length)return;const target=Math.max(0,Math.round((now-startPerf-delay*1000)*1000));if(target<=0)return;if(needSeek||Math.abs(delay-currentDelay)>.01||playIndex<0){await seekPlayback(now,target);return}if(decodeBusy||decoder.state!=='configured')return;const desired=playBaseTs+Math.round((now-playBasePerf)*1000);let fed=0;while(playIndex<chunks.length&&chunks[playIndex].timestamp<=desired+80000&&fed<6&&decoder.decodeQueueSize<8){const c=chunks[playIndex++];try{decoder.decode(new EncodedVideoChunk({type:c.type,timestamp:c.timestamp,duration:c.duration,data:c.data}));fed++}catch(e){needSeek=true;break}}}
function loop(now=performance.now()){capture(now);render(now);updateBuffering(now);raf=requestAnimationFrame(loop)}
async function stop(){running=false;cancelAnimationFrame(raf);try{await encoder?.flush()}catch{};encoder?.close();decoder?.close();stream?.getTracks().forEach(t=>t.stop());encoder=decoder=stream=null;chunks=[];configs=[];lastShown=-1;playIndex=-1;needSeek=true;ctx.clearRect(0,0,canvas.width,canvas.height);rotateView=false;canvas.width=W;canvas.height=H;buffering.classList.remove('show');startBtn.textContent='Start'}
function applyProfile(p){profile=p;const [q,f]=p.split('-').map(Number);quality=q;FPS=f;KEY_EVERY=FPS;if(q===1080){W=1920;H=1080;BITRATE=f===60?20_000_000:12_000_000}else{W=1280;H=720;BITRATE=f===60?12_000_000:8_000_000}canvas.width=W;canvas.height=H;badge.textContent=`${quality}p · ${FPS} fps · 60 s · v12.1`;document.querySelectorAll('.qbtn').forEach(b=>b.classList.toggle('active',b.dataset.profile===p));panel.classList.remove('open')}
gear.onclick=e=>{e.stopPropagation();panel.classList.toggle('open')};document.querySelectorAll('.qbtn').forEach(b=>b.onclick=async()=>{const p=b.dataset.profile;if(p===profile){panel.classList.remove('open');return}if(running)await stop();applyProfile(p)});document.addEventListener('pointerdown',e=>{if(!e.target.closest('.settings'))panel.classList.remove('open')});
document.querySelectorAll(".modebtn").forEach(b=>b.onclick=()=>{viewMode=b.dataset.mode;document.querySelectorAll(".modebtn").forEach(x=>x.classList.toggle("active",x.dataset.mode===viewMode));panel.classList.remove("open");if(viewMode==="delay"){lastShown=-1;needSeek=true}});
startBtn.onclick=()=>running?stop():init().catch(e=>fail(e.name==='NotAllowedError'?'Camera permission was denied. Allow camera access and reload.':e.message));
function updateBuffering(now){if(!running||viewMode!=="delay"){buffering.classList.remove('show');return}const available=Math.max(0,(now-startPerf)/1000);const remaining=Math.max(0,Math.ceil(delay-available));if(remaining>0){bufferCount.textContent=`${remaining} s`;buffering.classList.add('show')}else buffering.classList.remove('show')}
function setDelay(v){delay=Math.max(1,Math.min(MAX,v));dEl.textContent=delay;lastShown=-1;needSeek=true;if(running)updateBuffering(performance.now())}
function hold(el,delta){let timer,int;const down=e=>{e.preventDefault();setDelay(delay+delta);timer=setTimeout(()=>int=setInterval(()=>setDelay(delay+delta),80),350)};const up=()=>{clearTimeout(timer);clearInterval(int)};el.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(x=>el.addEventListener(x,up))}
hold(document.querySelector('#minus'),-1);hold(document.querySelector('#plus'),1);
if(!supported())fail('This version needs WebCodecs. On iPhone/iPad, use an up-to-date Safari version; on desktop, use a current Safari or Chrome.');
})();
</script></body></html>
