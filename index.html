<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Video Delay</title>
<style>
:root{color-scheme:dark;--panel:rgba(14,14,14,.72);--line:rgba(255,255,255,.18);--muted:rgba(255,255,255,.65)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{position:fixed;inset:0}
#stage{position:absolute;inset:0;background:#000;display:grid;place-items:center}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#live{opacity:0;pointer-events:none}
#playback{opacity:1}
.mirror{transform:scaleX(-1)}
#startScreen{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:#000}
#startBtn{border:1px solid rgba(255,255,255,.28);background:#fff;color:#000;font-size:18px;font-weight:700;border-radius:999px;padding:16px 28px;min-width:150px}
#ui{position:absolute;z-index:4;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 12px)}
.top{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:calc(env(safe-area-inset-left) + 12px);display:flex;gap:8px;align-items:center;pointer-events:auto}
.pill,.icon{height:44px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;border-radius:14px}
.pill{padding:0 14px;font-size:14px;font-weight:650}
.icon{width:44px;font-size:20px;display:grid;place-items:center}
#delayControl{position:absolute;right:calc(env(safe-area-inset-right) + 12px);top:50%;transform:translateY(-50%);width:76px;height:min(72vh,560px);border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:22px;pointer-events:auto;display:flex;flex-direction:column;align-items:center;padding:12px 8px;gap:8px}
#delayValue{font-size:20px;font-weight:750;line-height:1;white-space:nowrap}
#delayHint{font-size:10px;color:var(--muted)}
.sliderWrap{flex:1;display:grid;place-items:center;width:100%;overflow:hidden}
#delaySlider{width:360px;height:44px;transform:rotate(-90deg);touch-action:none;accent-color:#fff}
#status{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);font-size:12px;color:rgba(255,255,255,.78);background:rgba(0,0,0,.42);padding:7px 10px;border-radius:999px;white-space:nowrap;opacity:0;transition:.2s}
#status.show{opacity:1}
#settings{position:absolute;z-index:7;top:calc(env(safe-area-inset-top) + 64px);left:calc(env(safe-area-inset-left) + 12px);width:min(300px,calc(100vw - 24px));background:rgba(18,18,18,.94);border:1px solid var(--line);border-radius:18px;padding:14px;display:none;box-shadow:0 18px 60px rgba(0,0,0,.45)}
#settings.open{display:block}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid rgba(255,255,255,.09)}
.row:last-child{border-bottom:0}.label{font-size:14px}.sub{font-size:11px;color:var(--muted);margin-top:2px}
select,.toggle{font:inherit;color:#fff;background:#282828;border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:8px}
.toggle{min-width:54px}.danger{color:#ffb1b1}
#unsupported{display:none;position:absolute;z-index:10;inset:20px;background:#111;border:1px solid #333;border-radius:20px;padding:24px;place-items:center;text-align:center}
@media (max-height:520px){#delayControl{height:78vh;width:70px}.pill,.icon{height:40px}.icon{width:40px}}
</style>
</head>
<body>
<div id="stage">
  <video id="live" autoplay muted playsinline></video>
  <video id="playback" autoplay muted playsinline></video>
  <div id="startScreen"><button id="startBtn">Start camera</button></div>
  <div id="ui">
    <div class="top">
      <button id="runBtn" class="pill" hidden>Stop</button>
      <button id="settingsBtn" class="icon" aria-label="Settings">⚙︎</button>
    </div>
    <div id="delayControl">
      <div id="delayValue">10 s</div><div id="delayHint">DELAY</div>
      <div class="sliderWrap"><input id="delaySlider" type="range" min="1" max="120" step="1" value="10" aria-label="Delay seconds"></div>
    </div>
    <div id="status"></div>
  </div>
  <div id="settings">
    <div class="row"><div><div class="label">Quality</div><div class="sub">Standard recommended</div></div><select id="quality"><option value="performance">Performance</option><option value="standard" selected>Standard</option><option value="high">High</option></select></div>
    <div class="row"><div><div class="label">Camera</div></div><select id="camera"><option value="environment" selected>Back</option><option value="user">Front</option></select></div>
    <div class="row"><div><div class="label">Mirror</div></div><button id="mirrorBtn" class="toggle">Off</button></div>
    <div class="row"><div><div class="label">Local only</div><div class="sub">Nothing is uploaded or saved.</div></div></div>
  </div>
  <div id="unsupported"><div><h2>Camera unavailable</h2><p>This browser needs camera access and MediaRecorder support. Open the page via HTTPS in a current Safari, Chrome or Edge browser.</p></div></div>
</div>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id);
const live=$('live'), playback=$('playback'), startScreen=$('startScreen'), startBtn=$('startBtn'), runBtn=$('runBtn');
const slider=$('delaySlider'), delayValue=$('delayValue'), status=$('status'), settings=$('settings');
const quality=$('quality'), camera=$('camera'), mirrorBtn=$('mirrorBtn');
let stream=null, recorder=null, running=false, mirrored=false;
let segments=[]; // independently playable short clips: {url,blob,start,end}
let segmentStart=0, segmentTimer=null, playToken=0, currentUrl=null;
const SEGMENT_MS=2000, KEEP_MS=126000;

function say(msg,ms=1800){status.textContent=msg;status.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>status.classList.remove('show'),ms)}
function qualityConstraints(){
 const q=quality.value;
 if(q==='performance') return {width:{ideal:640},height:{ideal:480},frameRate:{ideal:24,max:30}};
 if(q==='high') return {width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30,max:30}};
 return {width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30,max:30}};
}
function bitrate(){return quality.value==='high'?5500000:quality.value==='performance'?1200000:2800000}
function bestMime(){
 const candidates=['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp8','video/webm'];
 return candidates.find(t=>window.MediaRecorder?.isTypeSupported?.(t)) || '';
}
async function openCamera(){
 if(!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder){$('unsupported').style.display='grid';return false}
 stopTracks();
 const constraints={audio:false,video:{...qualityConstraints(),facingMode:{ideal:camera.value}}};
 try{stream=await navigator.mediaDevices.getUserMedia(constraints)}catch(e){
   try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:true})}catch(err){say('Camera permission needed',3000);throw err}
 }
 live.srcObject=stream; await live.play().catch(()=>{}); return true;
}
function stopTracks(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}live.srcObject=null}
function clearSegments(){segments.forEach(s=>URL.revokeObjectURL(s.url));segments=[];if(currentUrl){URL.revokeObjectURL(currentUrl);currentUrl=null}}
function makeRecorder(){
 const mime=bestMime(), opts={videoBitsPerSecond:bitrate()}; if(mime)opts.mimeType=mime;
 return new MediaRecorder(stream,opts);
}
function beginSegment(){
 if(!running||!stream)return;
 let chunks=[]; segmentStart=performance.now();
 try{recorder=makeRecorder()}catch(e){say('Recording format not supported',3000);return}
 recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
 recorder.onstop=()=>{
   const end=performance.now();
   if(chunks.length){const type=recorder.mimeType||chunks[0].type||'video/mp4';const blob=new Blob(chunks,{type});const url=URL.createObjectURL(blob);segments.push({blob,url,start:segmentStart,end});prune(end)}
   if(running) setTimeout(beginSegment,0);
 };
 recorder.start();
 segmentTimer=setTimeout(()=>{if(recorder&&recorder.state==='recording')recorder.stop()},SEGMENT_MS);
}
function prune(now){
 const cutoff=now-KEEP_MS;
 while(segments.length&&segments[0].end<cutoff){const s=segments.shift(); if(s.url!==currentUrl)URL.revokeObjectURL(s.url)}
}
function targetSegment(){
 const target=performance.now()-(Number(slider.value)*1000);
 let best=null;
 for(const s of segments){if(s.start<=target)best=s;else break}
 return best;
}
async function showDelayed(){
 if(!running)return;
 const token=++playToken, s=targetSegment();
 if(!s){playback.removeAttribute('src');playback.load();say('Building buffer…',600);setTimeout(showDelayed,350);return}
 if(currentUrl!==s.url){currentUrl=s.url;playback.src=s.url;playback.load()}
 const target=performance.now()-(Number(slider.value)*1000);
 const offset=Math.max(0,Math.min((target-s.start)/1000,Math.max(0,(s.end-s.start)/1000-.05)));
 try{playback.currentTime=offset;await playback.play()}catch(e){}
 const remaining=Math.max(200,(s.end-target));
 setTimeout(()=>{if(token===playToken)showDelayed()},Math.min(remaining+40,500));
}
async function start(){
 if(running)return;
 const ok=await openCamera();if(!ok)return;
 clearSegments(); running=true; runBtn.hidden=false;runBtn.textContent='Stop';startScreen.style.display='none';beginSegment();showDelayed();say('Buffering…');
}
function stop(){
 running=false;clearTimeout(segmentTimer);++playToken;
 if(recorder&&recorder.state==='recording')recorder.stop();
 playback.pause();playback.removeAttribute('src');playback.load();stopTracks();clearSegments();runBtn.hidden=true;startScreen.style.display='grid';startBtn.textContent='Start camera';say('Stopped');
}
async function restartCamera(){if(!running)return;running=false;clearTimeout(segmentTimer);++playToken;if(recorder&&recorder.state==='recording')recorder.stop();stopTracks();clearSegments();await new Promise(r=>setTimeout(r,120));running=true;await openCamera();beginSegment();showDelayed();say('Buffer restarted')}
function updateDelay(){delayValue.textContent=slider.value+' s';localStorage.setItem('vd-delay',slider.value);if(running){++playToken;showDelayed()}}
startBtn.addEventListener('click',()=>start().catch(()=>{}));runBtn.addEventListener('click',stop);
slider.addEventListener('input',updateDelay);
$('settingsBtn').addEventListener('click',e=>{e.stopPropagation();settings.classList.toggle('open')});
document.addEventListener('click',e=>{if(!settings.contains(e.target)&&e.target!==$('settingsBtn'))settings.classList.remove('open')});
quality.addEventListener('change',()=>{localStorage.setItem('vd-quality',quality.value);restartCamera()});
camera.addEventListener('change',()=>{localStorage.setItem('vd-camera',camera.value);restartCamera()});
mirrorBtn.addEventListener('click',()=>{mirrored=!mirrored;playback.classList.toggle('mirror',mirrored);mirrorBtn.textContent=mirrored?'On':'Off';localStorage.setItem('vd-mirror',mirrored?'1':'0')});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&running)say('Keep this screen active',2000)});
window.addEventListener('pagehide',()=>{stopTracks();clearSegments()});
// Restore tiny set of preferences.
slider.value=localStorage.getItem('vd-delay')||'10';quality.value=localStorage.getItem('vd-quality')||'standard';camera.value=localStorage.getItem('vd-camera')||'environment';mirrored=localStorage.getItem('vd-mirror')==='1';playback.classList.toggle('mirror',mirrored);mirrorBtn.textContent=mirrored?'On':'Off';updateDelay();
})();
</script>
</body>
</html>
